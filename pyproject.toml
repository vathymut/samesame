[project]
name = "samesame-paper"
version = "0.1.0"
description = "Manuscript and experiments for the common-support harmful-shift paper. Depends on samesame from PyPI."
requires-python = ">=3.12"
dependencies = [
    "samesame>=0.4.1",
    "numpy >= 1.21",
    "scipy >= 1.15",
    "scikit-learn",
    "skrub>=0.9.0",
    "polars>=1.41.2",
    "typer>=0.26.7",
    "pandas",
    "matplotlib",
]
authors = [{ name = "Vathy M. Kamulete", email = "vathymut@gmail.com" }]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = [
  "UP", # pyupgrade
  "I",  # sort imports
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
