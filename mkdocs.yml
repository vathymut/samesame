site_name: samesame
repo_url: https://github.com/vathymut/samesame
repo_name: vathymut/samesame
site_url: https://vathymut.github.io/samesame/
site_description: Statistical tests for deciding whether a new population differs from a reference population, and whether the change is harmful.
site_author: Vathy M. Kamulete
copyright: Copyright &copy; Vathy M. Kamulete

nav:
  - Home: index.md
  - Tutorials:
    - Detect Whether Two Datasets Differ: examples/tutorials/detect-distribution-shift.md
    - Check Whether a Change Points in a Worse Direction: examples/tutorials/check-shift-harm.md
    - Focus on Shared Support with Importance Weights: examples/tutorials/adjust-for-covariate-shift.md
  - How-to guides:
    - Monitor Predicted Credit Risk: examples/credit/monitor-credit-risk.md
    - Monitor Model Confidence: examples/credit/monitor-model-confidence.md
    - Monitor Prediction Errors Once Labels Arrive: examples/credit/monitor-prediction-errors.md
    - Focus Harmful-Shift Testing on Shared Support: examples/weighting/source-reweighting.md
    - Restrict Testing to Common Support on Both Sides: examples/weighting/double-weighting.md
    - Diagnose Weight Concentration with Effective Sample Size: examples/weighting/diagnose-weight-concentration.md
  - Explanation:
    - When Importance Weights Help: explanation/importance-weights-rationale.md
    - Why the Harm Statistic Is Not Just AUC: explanation/harmful-shift-statistic.md
  - API reference:
      - Shift Testing: api/testing.md
      - Importance Weights: api/weighting.md
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
theme:
  name: material
  icon:
    logo: fontawesome/solid/check-double
    favicon: fontawesome/solid/check-double
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    primary: white
    accent: blue
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vathymut/samesame
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/samesame/
      name: PyPI
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js