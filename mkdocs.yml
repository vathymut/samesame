site_name: samesame
repo_url: https://github.com/vathymut/samesame
repo_name: vathymut/samesame
site_url: https://vathymut.github.io/samesame/
site_description: Statistical tests for comparing source and target score distributions — and whether the target moved toward worse outcomes.
site_author: Vathy M. Kamulete
copyright: Copyright &copy; Vathy M. Kamulete

nav:
  - Home: index.md
  - Get started: examples/tutorials/get-started.md
  - Guides:
    - Monitor a credit model: examples/credit/monitor-credit.md
    - Weight for common support: examples/weighting/weight-for-common-support.md
  - Explanation:
    - How the harm test works: explanation/harmful-shift-statistic.md
  - Reference:
      - Testing: api/testing.md
      - Weighting: api/weighting.md
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
theme:
  name: material
  icon:
    logo: fontawesome/solid/check-double
    favicon: fontawesome/solid/check-double
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.view
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vathymut/samesame
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/samesame/
      name: PyPI
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
