site_name: samesame
repo_url: https://github.com/vathymut/samesame
repo_name: vathymut/samesame
site_url: https://vathymut.github.io/samesame/
site_description: Statistical tests for deciding whether a new population differs from a reference population, and whether the change is harmful.
site_author: Vathy M. Kamulete
copyright: Copyright &copy; Vathy M. Kamulete

nav:
  - Home: index.md
  - Tutorials:
    - Detect whether two datasets differ: examples/tutorials/detect-distribution-shift.md
    - Check whether target shifted toward worse outcomes: examples/tutorials/check-shift-harm.md
    - Focus on common support with importance weights: examples/tutorials/adjust-for-covariate-shift.md
  - How-to guides:
    - Monitor predicted credit risk: examples/credit/monitor-credit-risk.md
    - Monitor model confidence: examples/credit/monitor-model-confidence.md
    - Monitor prediction errors once labels arrive: examples/credit/monitor-prediction-errors.md
    - Focus harmful-shift testing on common support: examples/weighting/source-reweighting.md
    - Restrict testing to common support on both sides: examples/weighting/double-weighting.md
    - Diagnose weight concentration with effective sample size: examples/weighting/diagnose-weight-concentration.md
  - Explanation:
    - When importance weights help: explanation/importance-weights-rationale.md
    - Why the harm statistic is not just AUC: explanation/harmful-shift-statistic.md
  - API reference:
      - Shift testing: api/testing.md
      - Importance weights: api/weighting.md
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
theme:
  name: material
  icon:
    logo: fontawesome/solid/check-double
    favicon: fontawesome/solid/check-double
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vathymut/samesame
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/samesame/
      name: PyPI
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
